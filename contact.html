<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — VendorHub</title>
  <style>
    :root {
      /* Placeholder palette — colors TBD */
      --ink: #1f2933;
      --ink-soft: #52606d;
      --bg: #ffffff;
      --bg-alt: #f5f7fa;
      --line: #d9e2ec;
      --accent: #334e68;
      --accent-ink: #ffffff;
      --danger: #b3261e;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
    }

    .wrap {
      max-width: 64rem;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* Header nav */
    .site-header {
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }

    .site-header .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    .wordmark {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0;
      text-decoration: none;
      color: var(--ink);
    }

    .site-nav ul {
      display: flex;
      gap: 1.25rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .site-nav a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .site-nav a:hover { text-decoration: underline; }

    .site-nav a:focus-visible,
    .site-nav a[aria-current="page"] {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* Page content */
    .page {
      padding: 3.5rem 0 4rem;
    }

    .page h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      line-height: 1.15;
      margin: 0 0 1.25rem;
    }

    .page > .wrap > p {
      color: var(--ink-soft);
      max-width: 42rem;
      margin: 0 0 2rem;
    }

    /* Form */
    .contact-form {
      max-width: 32rem;
    }

    .field { margin-bottom: 1.25rem; }

    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font: inherit;
      color: var(--ink);
      background: var(--bg);
    }

    .field textarea { min-height: 10rem; resize: vertical; }

    .field input:focus-visible,
    .field textarea:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .submit {
      padding: 0.75rem 1.75rem;
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      border-radius: var(--radius);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .submit:hover:not(:disabled) { opacity: 0.9; }

    .submit:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .submit:disabled { opacity: 0.6; cursor: wait; }

    .form-error {
      border: 1px solid var(--danger);
      border-left-width: 4px;
      border-radius: var(--radius);
      color: var(--danger);
      padding: 0.75rem 1rem;
      margin: 0 0 1.25rem;
    }

    /* Confirmation state */
    .confirmation {
      max-width: 32rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg-alt);
      padding: 2rem;
    }

    .confirmation h2 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
    }

    .confirmation p {
      margin: 0;
      color: var(--ink-soft);
    }

    /* Footer nav */
    .site-footer {
      border-top: 1px solid var(--line);
      background: var(--bg-alt);
      padding: 2rem 0;
    }

    .site-footer .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .site-footer .wordmark { font-size: 1rem; }

    .site-footer nav ul {
      display: flex;
      gap: 1.25rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .site-footer nav a {
      color: var(--ink-soft);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .site-footer nav a:hover { text-decoration: underline; }

    .site-footer nav a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .site-footer p { margin: 0; color: var(--ink-soft); font-size: 0.875rem; }

    @media (max-width: 30rem) {
      .page { padding: 2.5rem 0; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="wordmark" href="index.html">VendorHub</a>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="wrap">
      <h1>Contact us</h1>
      <p>Questions about the marketplace, selling on VendorHub, or your account? Send us a message and we'll get back to you.</p>

      <div id="form-region">
        <form class="contact-form" id="contact-form" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button type="submit" class="submit" id="submit-btn">Send message</button>
        </form>
      </div>

      <div id="status" role="status" aria-live="polite"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="wordmark">VendorHub</p>
      <nav aria-label="Footer">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <p>&copy; 2025 VendorHub</p>
    </div>
  </footer>

  <script>
    (function () {
      var ENDPOINT = "/api/contact";
      var form = document.getElementById("contact-form");
      var formRegion = document.getElementById("form-region");
      var statusEl = document.getElementById("status");
      var submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        // Clear any previous error
        statusEl.textContent = "";
        var oldError = formRegion.querySelector(".form-error");
        if (oldError) oldError.remove();

        if (!form.reportValidity()) return;

        var payload = {
          name: form.elements.name.value.trim(),
          email: form.elements.email.value.trim(),
          message: form.elements.message.value.trim()
        };

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending\u2026";

        fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            // Replace the form with a confirmation on the same page
            formRegion.innerHTML =
              '<div class="confirmation">' +
              '<h2>Message sent</h2>' +
              "<p>Thanks for reaching out. We've received your message and will get back to you at the email address you provided.</p>" +
              "</div>";
            statusEl.textContent = "Message sent successfully.";
          })
          .catch(function () {
            statusEl.textContent = "";
            var err = document.createElement("div");
            err.className = "form-error";
            err.setAttribute("role", "alert");
            err.textContent =
              "Sorry, your message couldn't be sent. Please try again.";
            formRegion.insertBefore(err, form);
            submitBtn.disabled = false;
            submitBtn.textContent = "Send message";
          });
      });
    })();
  </script>
</body>
</html>
